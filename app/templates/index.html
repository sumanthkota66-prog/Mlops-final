<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car CO2 Volume Form</title>
</head>
<body>
    <h2>Car CO2 Volume Prediction Form</h2>
    <form action="/predict" method="post">
        <label for="volume">Engine Volume (cm3):</label>
        <input type="number" id="volume" name="volume" min="500" required><br><br>

        <label for="weight">Car Weight (kg):</label>
        <input type="number" id="weight" name="weight" min="500" required><br><br>

        <label for="cylinders">Cylinders:</label>
        <select id="cylinders" name="cylinders" required>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="8">8</option>
        </select><br><br>

        <label for="fuel_type">Fuel Type:</label>
        <select id="fuel_type" name="fuel_type" required>
            <option value="Petrol">Petrol</option>
            <option value="Diesel">Diesel</option>
            <option value="Hybrid">Hybrid</option>
        </select><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
