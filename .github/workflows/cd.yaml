name: CI/CD - Build, Push , deploy

on:
  push:
    branches: [ "Dev" ]
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build and Push to Docker Hub
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest
          
      - name: 4. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker
        uses: docker/login-action@v1
        with:
            username: ${{secrets.DOCKER_HUB_USERNAME}}
            password: ${{secrets.DOCKER_HUB_ACCESS_TOKEN}}

      - name: Checkout
        uses: actions/checkout@v6
      
      - name: BuildImage
        run: |
          cd app
          docker build . -t ${{secrets.DOCKER_HUB_USERNAME}}/car-co2-prediction:latest

      - name: PushToHub
        run: docker push ${{secrets.DOCKER_HUB_USERNAME}}/car-co2-predicition:latest

      - name: Deploy via Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          ./kind create cluster

          ./kind load docker-image ${{ secrets.DOCKER_HUB_USERNAME }}/car-co2-prediciton:latest

          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml 
